<div class="dk"><span class="tag">● SIAGA · LEVEL III</span><p><b style="font-weight:600">Anak Krakatau.</b> Dilarang memasuki radius 5 km dari pusat erupsi. Waspadai lontaran batu pijar dan hujan abu.</p><button data-a="det" data-v="0">Buka laporan detail ${I('arr',16)}</button></div>
<h2>Kontak darurat</h2><div class="emg"><a href="tel:117">${I('ph',20)}<b>117</b><span class="cap">BNPB</span></a><a href="tel:115">${I('ph',20)}<b>115</b><span class="cap">Basarnas</span></a><a href="tel:0227272606">${I('ph',20)}<b>PVMBG</b><span class="cap">Bandung</span></a></div>`,
peta:()=>head('Sebaran','Peta Gunung Api')+lvChips()+`<div class="map"><div class="mi">${[['Sumatera',100,-1.5],['Kalimantan',110,1.5],['Jawa',107,-9.8],['Nusa Tenggara',117,-10.4],['Sulawesi',120,-3.5],['Maluku',126,-6.5]].map(([n,x,y])=>`<span class="rg" style="left:${(x-94)/48*100}%;top:${(7-y)/18*100}%">${n}</span>`).join('')}${V.map((x,i)=>(!S.lv||x[3]==S.lv)?`<button class="pin l${x[3]}" style="--c:var(${L[x[3]][1]});left:${(x[4]-94)/48*100}%;top:${(7-x[5])/18*100}%" data-a="pin" data-v="${i}">${RM[x[3]]}</button>`:'').join('')}</div></div><p class="cap" style="margin-top:10px">Geser peta ke kanan · ketuk penanda untuk detail</p><div class="leg">${[4,3,2,1].map(l=>`<span><i style="--c:var(${L[l][1]})"></i>${RM[l]} ${L[l][0]}</span>`).join('')}</div>`,
gunung:()=>head('Status aktivitas','Daftar Gunung')+`<label class="srch">${I('search',20)}<input id="q" placeholder="Cari gunung, provinsi, pulau" value="${S.q}"></label>`+chips([['','Semua wilayah'],...RG.map(r=>[r,r])],S.reg,'reg')+lvChips()+`<div id="lst">${list()}</div>`,
edu:()=>head('Edukasi &','Panduan Mitigasi')+chips([['','Semua'],...[...new Set(ED.map(e=>e[0]))].map(c=>[c,c])],S.ec,'ec')+`<div style="margin-top:16px">${ED.filter(e=>!S.ec||e[0]==S.ec).map(e=>`<div class="ed"><div class="row"><span class="tg">${e[0]}</span><span class="cap" style="display:flex;gap:4px;align-items:center">${I('clock',14)}${e[1]} mnt</span></div><div class="t">${e[2]}</div><p>${e[3]}</p><div class="src"><span>${e[4]}</span><b>Baca</b></div></div>`).join('')}</div>`,
check:()=>{const n=S.ck.size;let g='';return head('Kesiapan mandiri','Tas Siaga 72 Jam')+`<div class="hero" style="margin-bottom:0"><span class="big">${n}</span><div class="un"><b>/ 12</b><small>TERPENUHI</small></div></div><div class="prog"><i style="width:${n/12*100}%"></i></div><p class="cap" style="text-transform:none;letter-spacing:0;font-size:14px">Masukkan semuanya ke ransel siaga keluarga.</p>`+CK.map((c,i)=>{let h='';if(c[0]!=g){g=c[0];h=`<h2 style="font-size:17px;margin:22px 0 10px">${g}</h2>`}return h+`<button class="ck ${S.ck.has(i)?'on':''}" data-a="ck" data-v="${i}"><span class="bx">${S.ck.has(i)?I('ok',16):''}</span><div class="tx"><div class="nm">${c[1]}</div><small>${c[2]}</small></div></button>`}).join('')}};
function detail(){const x=V[S.d],l=x[3],tabs=['Rekomendasi','Visual','Kegempaan','Cuaca'];let b;
if(S.tab==0)b=REC[l].map((t,i)=>`<div class="rw"><span class="n">${i+1}</span><p>${t}</p></div>`).join('')+`<div class="rw"><span class="n">${I('ph',16)}</span><p>PVMBG (022) 7272606, Bandung</p></div>`;
else if(S.tab==1)b=`<div class="rw"><p>Gunung api tertutup kabut 0–III. Asap kawah nihil. Cuaca mendung, angin tenang ke arah barat.</p></div>`;
else if(S.tab==2)b=[['Guguran','20×','amp. 2–65 mm'],['Hembusan','4×','amp. 7–42 mm'],['Hybrid / fase banyak','8×','amp. 2–27 mm'],['Tektonik jauh','1×','amp. 41 mm']].map(r=>`<div class="rw">${r[0]}<span><b style="color:var(--ink);font-weight:600">${r[1]}</b> · ${r[2]}</span></div>`).join('');
else b=[['Suhu udara','20–23,1 °C'],['Kelembaban','92–99%'],['Tekanan udara','874,3–918,05 mmHg']].map(r=>`<div class="rw">${r[0]}<span>${r[1]}</span></div>`).join('');
return `<div class="dh" style="--c:var(${L[l][1]})"><span class="rn">${RM[l]}</span><div class="top"><button class="rnd" data-a="back" aria-label="Kembali">${I('back')}</button><div class="row"><button class="rnd" data-a="share" aria-label="Bagikan">${I('share')}</button></div></div></div>
<div class="db"><p class="lt">Gunung</p><h1 style="font-size:38px">${x[0]}</h1><div class="pl"><span>${rm(l).replace('height:36px','')}Level ${RM[l]} · ${L[l][0]}</span><span>${I('pin',16)}${x[2]}</span><span>${I('clock',16)}12:00–18:00 WIB</span></div>
<div class="tabs">${tabs.map((t,i)=>`<button class="tab ${S.tab==i?'on':''}" data-a="tab" data-v="${i}">${t}</button>`).join('')}</div>${b}<p class="cap" style="margin-top:16px">Laporan Sen, 23 Nov 2026 · diambil 23:30 WIB</p></div>
<div class="cta"><button class="rnd ${S.fav.has(S.d)?'on':''}" data-a="fav" data-v="${S.d}" aria-label="Pantau">${I('star',24,S.fav.has(S.d))}</button><a class="btn" href="https://magma.esdm.go.id" target="_blank" rel="noopener">${I('arr',18)} Laporan resmi MAGMA</a></div>`}
function render(){$('v').innerHTML=views[S.t]();
$('nav').innerHTML=[['home','Beranda','home'],['peta','Peta','map'],['gunung','Gunung','vol'],['edu','Edukasi','book'],['check','Checklist','chk']].map(([k,n,ic])=>`<button class="${S.t==k?'on':''}" data-a="t" data-v="${k}" aria-label="${n}">${I(ic,22)}<span>${n}</span></button>`).join('');
const d=$('dt');if(S.d===null){d.hidden=true}else{const y=d.scrollTop;d.innerHTML=detail();d.hidden=false;d.scrollTop=y}
const s=$('sh');if(S.sel!==null&&S.t=='peta'&&S.d===null){const x=V[S.sel];s.innerHTML=`<div class="row">${rm(x[3])}<div class="tx"><div class="nm">${x[0]}</div><small>${L[x[3]][0]} · ${x[2]}</small></div><button class="star" data-a="x">✕</button></div><button class="btn" data-a="det" data-v="${S.sel}">Lihat detail</button>`;s.classList.add('on')}else s.classList.remove('on')}
const rad=d=>d*Math.PI/180;
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
if(a=='t'){S.t=v;S.sel=null;$('v').scrollTop=0}
else if(a=='lv')S.lv=+v;else if(a=='lvg'){S.lv=+v;S.t='gunung';$('v').scrollTop=0}
else if(a=='reg')S.reg=v;else if(a=='ec')S.ec=v;
else if(a=='det'){S.d=+v;S.tab=0;$('dt').scrollTop=0}else if(a=='back')S.d=null;
else if(a=='tab')S.tab=+v;
else if(a=='fav'){const i=+v;S.fav.has(i)?S.fav.delete(i):S.fav.add(i);save()}
else if(a=='ck'){const i=+v;S.ck.has(i)?S.ck.delete(i):S.ck.add(i);save()}
else if(a=='pin')S.sel=+v;else if(a=='x')S.sel=null;
else if(a=='sync'){toast('Data PVMBG diperbarui baru saja');return}
else if(a=='share'){const u=location.href;try{navigator.share?navigator.share({title:'SiagaGunung',url:u}):toast('Berbagi tidak didukung di perangkat ini')}catch(_){}return}
else if(a=='gps'){if(!navigator.geolocation){toast('GPS tidak tersedia');return}
navigator.geolocation.getCurrentPosition(p=>{let b,m=1e9;V.forEach(x=>{const dl=rad(x[5]-p.coords.latitude),dn=rad(x[4]-p.coords.longitude),h=Math.sin(dl/2)**2+Math.cos(rad(p.coords.latitude))*Math.cos(rad(x[5]))*Math.sin(dn/2)**2,k=12742*Math.asin(Math.sqrt(h));if(k<m){m=k;b=x}});toast(`Terdekat: ${b[0]} (${Math.round(m)} km)`)},()=>toast('Izin lokasi tidak diberikan'));return}
render()});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;$('lst').innerHTML=list()}});
render();
</script></body></html>
