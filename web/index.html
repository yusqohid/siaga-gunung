<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplikasi Informasi Aktivitas dan Edukasi Kesiapsiagaan Gunung Api (Android & Web).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SiagaGunung">
  <meta name="theme-color" content="#1B1B19">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SiagaGunung — Informasi Aktivitas & Edukasi Mitigasi Gunung Api</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #EDEDEA;
      overflow: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #EDEDEA;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.4s ease-out, visibility 0.4s;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .loader-logo {
      animation: pulse-logo 2.2s ease-in-out infinite;
    }

    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .particle {
      animation: float-smoke 1.8s ease-in-out infinite alternate;
    }
    .particle-2 {
      animation-delay: 0.35s;
    }
    .particle-3 {
      animation-delay: 0.7s;
    }

    @keyframes float-smoke {
      0% { transform: translateY(0); opacity: 0.6; }
      100% { transform: translateY(-5px); opacity: 1; }
    }

    .loader-title {
      margin: 16px 0 6px 0;
      font-size: 22px;
      font-weight: 700;
      color: #1B1B19;
      letter-spacing: -0.4px;
    }

    .loader-subtitle {
      margin: 0;
      font-size: 13px;
      color: #7B7B75;
      font-weight: 400;
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin-top: 24px;
      border: 3px solid rgba(242, 176, 74, 0.18);
      border-top-color: #F2B04A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #app-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @media (prefers-color-scheme: dark) {
      body, #app-loader {
        background-color: #151513;
      }
      .loader-title {
        color: #F3F3EE;
      }
      .loader-subtitle {
        color: #9C9C95;
      }
      .spinner {
        border-color: rgba(242, 176, 74, 0.22);
        border-top-color: #F2B04A;
      }
    }
  </style>
</head>
<body>
  <div id="app-loader">
    <div class="loader-content">
      <div class="loader-logo">
        <svg width="96" height="86" viewBox="150 130 724 652" xmlns="http://www.w3.org/2000/svg">
          <!-- Smoke / ash particles -->
          <circle cx="512" cy="262" r="34" fill="#F8CD86" class="particle particle-1" />
          <circle cx="462" cy="188" r="14" fill="#F8CD86" opacity="0.75" class="particle particle-2" />
          <circle cx="566" cy="202" r="21" fill="#F8CD86" opacity="0.9" class="particle particle-3" />
          <!-- Mountain body -->
          <path d="M186 742 L418 368 H606 L838 742 Z" fill="#F2B04A" stroke="#F2B04A" stroke-width="52" stroke-linejoin="round" />
          <!-- Shaded face -->
          <path d="M512 368 H606 L838 742 H512 Z" fill="#E39A1E" />
          <!-- Crater -->
          <ellipse cx="512" cy="368" rx="104" ry="30" fill="#1B1B19" />
          <ellipse cx="512" cy="364" rx="66" ry="16" fill="#E8742C" />
          <path d="M486 378 L512 456 L538 378 Z" fill="#E8742C" opacity="0.9" />
        </svg>
      </div>
      <h1 class="loader-title">SiagaGunung</h1>
      <p class="loader-subtitle">Memuat data dan sistem pemantauan...</p>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    (function() {
      var loader = document.getElementById('app-loader');
      if (!loader) return;

      var dismissed = false;
      function hideLoader() {
        if (dismissed) return;
        dismissed = true;
        loader.classList.add('fade-out');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 450);
      }

      // 1. Primary trigger: Flutter first frame event
      window.addEventListener('flutter-first-frame', hideLoader);

      // 2. Secondary fallback: Observe Flutter DOM elements injection
      var observer = new MutationObserver(function(mutations, obs) {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
          setTimeout(hideLoader, 250);
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // 3. Absolute timeout safety (15 seconds max)
      setTimeout(hideLoader, 15000);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
