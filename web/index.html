<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplikasi Informasi Aktivitas dan Edukasi Kesiapsiagaan Gunung Api (Android & Web).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SiagaGunung">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SiagaGunung — Informasi Aktivitas & Edukasi Mitigasi Gunung Api</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FAFAFA;
      overflow: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FAFAFA;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.4s ease-out, visibility 0.4s;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .loader-logo {
      animation: pulse-logo 2.2s ease-in-out infinite;
    }

    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .particle {
      animation: float-smoke 1.8s ease-in-out infinite alternate;
    }
    .particle-2 {
      animation-delay: 0.35s;
    }
    .particle-3 {
      animation-delay: 0.7s;
    }

    @keyframes float-smoke {
      0% { transform: translateY(0); opacity: 0.6; }
      100% { transform: translateY(-5px); opacity: 1; }
    }

    .loader-title {
      margin: 16px 0 6px 0;
      font-size: 22px;
      font-weight: 700;
      color: #1E293B;
      letter-spacing: -0.4px;
    }

    .loader-subtitle {
      margin: 0;
      font-size: 13px;
      color: #64748B;
      font-weight: 400;
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin-top: 24px;
      border: 3px solid rgba(211, 47, 47, 0.15);
      border-top-color: #D32F2F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #app-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @media (prefers-color-scheme: dark) {
      body, #app-loader {
        background-color: #121212;
      }
      .loader-title {
        color: #F8FAFC;
      }
      .loader-subtitle {
        color: #94A3B8;
      }
      .spinner {
        border-color: rgba(239, 83, 80, 0.2);
        border-top-color: #EF5350;
      }
    }
  </style>
</head>
<body>
  <div id="app-loader">
    <div class="loader-content">
      <div class="loader-logo">
        <svg width="68" height="68" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Mountain slopes -->
          <path d="M6 52L24 20H40L58 52H6Z" fill="#37474F" />
          <!-- Crater cap -->
          <path d="M24 20L28 27L32 23L36 27L40 20H24Z" fill="#D32F2F" />
          <!-- Magma fissure -->
          <path d="M30 25V36L32 38L34 36V25L32 23L30 25Z" fill="#FF5722" />
          <!-- Smoke / ash particles -->
          <circle cx="32" cy="13" r="3.5" fill="#FF9800" class="particle particle-1" />
          <circle cx="27" cy="8" r="2.5" fill="#FF5722" class="particle particle-2" />
          <circle cx="37" cy="7" r="2.5" fill="#FFC107" class="particle particle-3" />
        </svg>
      </div>
      <h1 class="loader-title">SiagaGunung</h1>
      <p class="loader-subtitle">Memuat data dan sistem pemantauan...</p>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    (function() {
      var loader = document.getElementById('app-loader');
      if (!loader) return;

      var dismissed = false;
      function hideLoader() {
        if (dismissed) return;
        dismissed = true;
        loader.classList.add('fade-out');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 450);
      }

      // 1. Primary trigger: Flutter first frame event
      window.addEventListener('flutter-first-frame', hideLoader);

      // 2. Secondary fallback: Observe Flutter DOM elements injection
      var observer = new MutationObserver(function(mutations, obs) {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
          setTimeout(hideLoader, 250);
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // 3. Absolute timeout safety (15 seconds max)
      setTimeout(hideLoader, 15000);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
